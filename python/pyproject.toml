[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "limitr"
version = "0.8.8"
description = "Limits, credits, and billing inside your AI product: an open-source engine that decides what each customer can do, what it costs you, and what to bill, on every call, in-process."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Formata, Inc.", email = "info@limitr.dev" }]
dependencies = ["stof>=0.11.6,<0.12", "websockets>=13"]
keywords = ["usage-based-billing", "usage-based-pricing", "entitlements", "metering", "feature-flags", "rate-limiting", "llm", "ai-agents", "credits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://limitr.dev"
Documentation = "https://limitr.dev/docs/introduction"
Repository = "https://github.com/dev-formata-io/limitr"
Issues = "https://github.com/dev-formata-io/limitr/issues"

[tool.setuptools]
packages = ["limitr"]

[tool.setuptools.package-data]
limitr = ["engine.bstf", "network.bstf", "py.typed"]
